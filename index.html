<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calcron — time & duration calculator</title>
    <meta
      name="description"
      content="Calcron: a tiny DSL for calculating with times and durations, in a dark-mode IDE."
    />
    <meta name="google-site-verification" content="SBubf_fm84lVlFIYA3G8DcKsiGLshuZMx00iympyqUg" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark">⏱</span>
          <span class="brand-name">Calcron</span>
          <span class="brand-tag">time &amp; duration calculator</span>
        </div>
        <div class="header-actions">
          <button
            id="settings-btn"
            class="icon-btn"
            type="button"
            title="Settings"
            aria-label="Settings"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="currentColor"
                d="M19.14 12.94a7.49 7.49 0 0 0 .05-.94 7.49 7.49 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7 7 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.34 8.8a.5.5 0 0 0 .12.64l2.03 1.58c-.03.31-.05.62-.05.94 0 .32.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.31.6.22l2.39-.96c.5.39 1.05.71 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.57-.23 1.12-.55 1.62-.94l2.39.96c.22.09.47.01.6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"
              />
            </svg>
          </button>
          <a
            class="repo-link"
            href="https://github.com/FreshMag/calcron"
            target="_blank"
            rel="noreferrer noopener"
            title="View source"
            >source</a
          >
        </div>
      </header>
      <main class="editor-shell">
        <div id="editor" class="editor"></div>
      </main>
      <footer class="app-footer">
        <span id="status" class="status">ready</span>
        <span class="hint">
          Write one expression per line. Try <code>15:06 + 31m</code> or
          <code>(00:15s..00:45s) / 2</code>.
        </span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
